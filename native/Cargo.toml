[package]
name = "vsagent_native"
version = "2.3.0"
edition = "2021"

[lib]
name = "vsagent_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
ignore = "0.4"
regex = "1.13"
globset = "0.4"
once_cell = "1.20"
similar = { version = "3.2", features = ["text"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
