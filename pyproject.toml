[project]
name = "valstorm-agent"
version = "4.2.0"
description = "Valstorm Autonomous AI Agent Runtime & CLI"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "google-genai>=0.1.0",
    "anthropic>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "prompt-toolkit>=3.0.53",
    "docker>=7.0.0",
    "e2b-code-interpreter>=2.9.1",
    "pyyaml>=6.0.3",
    "valstorm-sanitizer",
    "valstorm-client>=0.1.0",
]

[project.scripts]
vsagent = "cli.main:app"
vagent = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "providers", "tools", "cli", "server.py"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: Live API integration tests requiring active API keys",
]
